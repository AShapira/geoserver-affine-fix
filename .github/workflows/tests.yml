name: Standalone checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python -m unittest discover -s bundles/kartoza-geoserver-affine-fix/tests -p 'test_*.py' -v
      - run: uv run python -m unittest discover -s bundles/kartoza-geoserver-2.28.0-affine-fix/tests -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test viewer/tests/adapter.test.mjs
